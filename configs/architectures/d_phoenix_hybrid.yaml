_base_: base_2p4k.yaml

model:
  architecture: phoenix_hybrid
  model_width: 128
  encoder_layers: 6
  decoder_layers: 0
  attention_every: 0

loss:
  phase_weight: 0.05

adversarial:
  periods: [2, 3, 5]
  schedule: cyclic
  start_step: 7000
  warmup_steps: 5000
  recovery_start_step: 24000

training:
  output_dir: runs/arch4_d_phoenix_hybrid
