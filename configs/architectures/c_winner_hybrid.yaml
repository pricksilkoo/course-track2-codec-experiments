_base_: base_2p4k.yaml

model:
  architecture: winner_hybrid
  model_width: 160
  encoder_layers: 0
  decoder_layers: 5
  attention_every: 2

loss:
  phase_weight: 0.05
  # The published winner reduced its reconstruction pressure in stage two.
  spectral_second_stage_step: 16000
  spectral_second_stage_scale: 0.55

adversarial:
  periods: [2, 3]
  start_step: 7000
  warmup_steps: 5000

training:
  output_dir: runs/arch4_c_winner_hybrid
