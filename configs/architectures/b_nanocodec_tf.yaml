_base_: base_2p4k.yaml

model:
  architecture: nanocodec_tf
  model_width: 176
  encoder_layers: 10
  decoder_layers: 7
  attention_every: 0

loss:
  # Energy/content decoupling in the encoder is reinforced by explicit
  # phase-consistency and frame-energy reconstruction terms.
  phase_weight: 0.12
  energy_weight: 0.20

adversarial:
  periods: [2, 3, 5]
  start_step: 8000
  warmup_steps: 6000

training:
  output_dir: runs/arch4_b_nanocodec_tf
