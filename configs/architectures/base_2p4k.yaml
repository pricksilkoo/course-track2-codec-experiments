_base_: ../baseline_16k_2p4k.yaml

audio:
  segment_samples: 32000

model:
  # All four paper-inspired adaptations preserve the external 3-byte frame.
  architecture: vocodec_tf
  model_width: 176
  encoder_layers: 8
  decoder_layers: 6
  architecture_expansion: 2
  attention_every: 0
  algorithmic_delay_ms: 30
  rvq_codebook_dim: 8
  rvq_ema_decay: 0.95

loss:
  waveform_l1_weight: 1.0
  spectral_weight: 1.0
  spectral_convergence_weight: 0.25
  linear_magnitude_weight: 0.1
  phase_weight: 0.0
  energy_weight: 0.0

adversarial:
  start_step: 6000
  warmup_steps: 6000
  learning_rate: 0.0002

training:
  # The server's torch 2.11/cuDNN 9.19 combination currently fails to create
  # cuDNN handles. Native CUDA kernels remain healthy and deterministic.
  disable_cudnn: true
  batch_size: 48
  num_workers: 8
  epochs: 1000
  learning_rate: 0.0003
  minimum_learning_rate: 0.00003
  warmup_steps: 1500
  validation_limit: 16
  validation_checkpoint_interval_steps: 5000
  sample_inference_count: 2
  output_dir: runs/arch4_base
